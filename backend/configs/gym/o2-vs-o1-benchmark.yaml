# O2 and O1 each face the same sparring partners on the same scenarios.
name: o2-vs-o1-benchmark
mode: benchmark
a: o2-qwen
b: o1-qwen
opponents:
  - scripted:hardliner
  - scripted:liar
  - scripted:injector
  - {kind: "persona:tough", model: qwen-local}
  - {kind: "persona:manipulator", model: qwen-local}
  - {kind: "persona:injector", model: qwen-local}
scenarios: {per_cell: 10, info_modes: [private], max_rounds: [6], deadline_known: [true, false]}
protocol: freetext
detector: text
reader: shadow:rules+llm:qwen-local     # rules decide; Qwen reads the ambiguous messages, log-only (regateo readings RUN)
seed: 2
settings: {concurrency: 32, cache: readwrite}
