# The climb loop's proposer (regateo propose / climb). Thinking is off: on a 5-7k token failure bundle
# Qwen's reasoning alone fills what's left of vLLM's 16k context. The proposal schema asks for the
# failure and the hypothesis before the change, so the model reasons in those fields instead.
# No presence penalty: prompt edits must copy passages of the prompt exactly.
name: qwen-local-propose
provider: openai
model: qwen-local
base_url: ${VLLM_BASE_URL:-http://localhost:8001/v1}
max_tokens: 4000
max_concurrency: 1
timeout_s: 600
max_retries: 0
extra:
  temperature: 0.7
  top_p: 0.8
  presence_penalty: 0.0
  extra_body:
    top_k: 20
    chat_template_kwargs: {enable_thinking: false}
