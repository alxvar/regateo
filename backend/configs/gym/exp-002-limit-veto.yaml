# Experiment 002 (docs/experiments/002-limit-veto.md): can a code veto remove deals past our own limit
# from o1/v2 without costing value or deals? Full bench with early stopping; o1-qwen and o1/v2 replay.
name: exp-002-limit-veto
bench: standard-v1
reference: o1-qwen
challengers:
  - o1/v2                  # 001's winner, no veto
  - o2/v2-limit            # never offer or accept past the limit
  - o2/v2-limit-quiet      # + never write a price past the limit
  - o2/v2                  # O2's original veto: + no walking back, no stray or leaked prices
early_stop: true
settings: {concurrency: 32, cache: readwrite}
