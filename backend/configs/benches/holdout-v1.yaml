# The holdout bench (docs/04-hill-climbing.md §4): only for promotion candidates. Nobody mines its
# transcripts for ideas; after about 5 promotions, or once it has shaped a design choice, it retires into
# dev and holdout-v2 replaces it. Frozen once it has results.
#
# Everything differs from standard-v1: seed, items, a price scale about 20x larger, 5 or 10 rounds, and
# opponents dev never plays. Two of them look for fixed patterns in our play and exploit them (the
# concern of a stronger, adaptive opponent), one with Qwen thinking on.
# 2 cells x 6 scenarios x 5 opponents x 2 roles = 120 pairs per challenger.
purpose: holdout
mode: benchmark
opponents:
  - {kind: "persona:exploiter", model: qwen-local-think}
  - {kind: "persona:exploiter", model: qwen-local}
  - {kind: "persona:naive", model: qwen-local-think}
  - {kind: o1, model: qwen-local, name: o1-strategy, params: {prompt: negotiator_system.v2}}
  - {kind: boulware, params: {boulware: 0.5}}
scenarios:
  items: ["a used cargo van", "a restored vintage motorcycle", "a year of office-space subletting",
          "a batch of refurbished laptops"]
  seller_reservation: [1500, 4000]
  zopa: [150, 1500]
  market_margin: [300, 1200]
  per_cell: 6
  info_modes: [private]
  max_rounds: [5, 10]
  deadline_known: [true]
protocol: freetext
detector: text
reader: shadow:llm-first:qwen-local/qwen-local-think+rules-v2   # same reading as standard-v1
seed: 17
