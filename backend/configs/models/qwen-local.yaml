# Local Qwen served by vLLM (scripts/serve_qwen_vllm.sh), through the OpenAI API.
name: qwen-local
provider: openai
model: qwen-local                  # vLLM --served-model-name
base_url: ${VLLM_BASE_URL:-http://localhost:8001/v1}
max_tokens: 4096
max_concurrency: 16                # keep <= vLLM --max-num-seqs
timeout_s: 180
max_retries: 1
extra:
  # Qwen3.8 model card, non-thinking mode. With thinking on: temperature 1.0, top_p 0.95, presence_penalty 0.
  temperature: 0.7
  top_p: 0.8
  presence_penalty: 1.5
  extra_body:
    top_k: 20
    chat_template_kwargs: {enable_thinking: false}   # set true to let Qwen reason before answering
