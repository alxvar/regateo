# standard-v2: standard-v1 with the rules-v2 reader (referee/reader.py rule_reading). Same opponents,
# scenarios and seed, so most matches replay from the cache; replayed over 3,408 stored matches, the
# reader changed 9 outcomes, most of them deals v1 closed at a price nobody had just offered.
#
# full: 2 cells x 10 scenarios x 6 opponents x 2 roles = 240 pairs per challenger (share CI about +-0.04).
# screen: the first 4 scenarios per cell, 96 pairs (about +-0.07): enough to drop clear losers early.
mode: benchmark
opponents:
  - scripted:hardliner
  - scripted:liar
  - scripted:injector
  - {kind: "persona:tough", model: qwen-local}
  - {kind: "persona:manipulator", model: qwen-local}
  - {kind: "persona:injector", model: qwen-local}
scenarios: {per_cell: 10, info_modes: [private], max_rounds: [6], deadline_known: [true, false]}
tiers: {screen: 4}
protocol: freetext
detector: text
reader: shadow:rules-v2+llm:qwen-local  # rules-v2: no deal at a stale price; ultimatums offer their price
seed: 2
