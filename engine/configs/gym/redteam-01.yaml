# The two lines climbing in round-02 (ranged and tools) and the reference against the red-team opponents
# (adversarial-v1), before that round: their findings go into its builder sessions. ranged/v3/hold-standing is
# ranged/v2/hold with the veto on offers worse than their standing offer, so the pair measures the veto too.
# Every challenger plays the whole bench: the point is to read where each one breaks, not to rank them.
name: redteam-01
bench: adversarial-v1
reference: single_call/v1/baseline
challengers:
  - ranged/v2/hold
  - ranged/v3/hold-standing
  - tools/v1/call
settings: {concurrency: 32, cache: readwrite}
