# qwen-local without the presence penalty. Hypothesis: presence_penalty 1.5 pushes the model off
# numbers already in the conversation, including its own last offer, which would mean conceding.
name: qwen-local-pp0
provider: openai
model: qwen-local
base_url: ${VLLM_BASE_URL:-http://localhost:8001/v1}
max_tokens: 4096
max_concurrency: 16
timeout_s: 180
max_retries: 1
extra:
  temperature: 0.7
  top_p: 0.8
  presence_penalty: 0.0
  extra_body:
    top_k: 20
    chat_template_kwargs: {enable_thinking: false}
