[project]
name = "regateo"
version = "0.1.0"
description = "Negotiation agent, evaluation gym and tournament arena"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "regateo-agent-sdk",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regateo"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.uv.sources]
regateo-agent-sdk = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls a real model endpoint (skipped unless credentials/endpoint are set)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[project.scripts]
regateo = "regateo.cli.main:app"
