# The dev bench: what every challenger is measured on, and the only bench the proposer may learn from.
# Frozen: to change opponents, scenarios, rules or the reader, add standard-v2 and re-run the reference.
# Numbers from different benches are not comparable.
#
# full: 2 cells x 10 scenarios x 6 opponents x 2 roles = 240 pairs per challenger (coupled pairs: the
# challenger and the reference share draws until their behaviour differs, so the range is narrow).
# screen: the first 4 scenarios per cell, 96 pairs.
mode: benchmark
opponents:
  - scripted:hardliner
  - scripted:liar
  - scripted:injector
  - {kind: "persona:tough", model: qwen-local}
  - {kind: "persona:manipulator", model: qwen-local}
  - {kind: "persona:injector", model: qwen-local}
scenarios: {per_cell: 10, info_modes: [private], max_rounds: [6], deadline_known: [true, false]}
tiers: {screen: 4}
protocol: freetext
detector: text
# Qwen reads every message, Qwen with thinking re-reads each acceptance; the rules are logged alongside.
reader: shadow:llm-first:qwen-local/qwen-local-think+rules-v2
seed: 2
